# Only with a unique sprint3-verify-* project. No existing ports or data volumes.
services:
  mysql:
    ports: !reset []
  rabbitmq:
    ports: !reset []
  redis:
    ports: !reset []
  monolith:
    ports: !override ["127.0.0.1::8080"]
    environment:
      Seed__Demo: "false"
  trip-tracking:
    ports: !override ["127.0.0.1::8080"]
  notification:
    ports: !override ["127.0.0.1::8080"]
  gateway:
    ports: !override ["127.0.0.1::8080"]
