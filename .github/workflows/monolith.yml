name: Monolith CI

on:
  push:
    branches:
      - develop
    paths:
      - 'src/Monolith/**'
      - 'Directory.Build.props'
      - '.github/workflows/monolith.yml'

jobs:
  build-and-push:
    outputs:
      image_tag: ${{ steps.release.outputs.image_tag }}

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Set release tag
        id: release
        run: echo "image_tag=$GITHUB_SHA-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"


      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build \
            -f src/Monolith/Dockerfile \
            -t monolith:${{ steps.release.outputs.image_tag }} .

      - name: Tag Docker Image
        run: |
          docker tag monolith:${{ steps.release.outputs.image_tag }} \
          ${{ secrets.ECR_MONOLITH_REPOSITORY }}:${{ steps.release.outputs.image_tag }}

      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.ECR_MONOLITH_REPOSITORY }}:${{ steps.release.outputs.image_tag }}

  deploy:
    needs: build-and-push
    uses: ./.github/workflows/deploy-ec2.yml
    with:
      service: monolith
      image_tag: ${{ needs.build-and-push.outputs.image_tag }}
    secrets: inherit
