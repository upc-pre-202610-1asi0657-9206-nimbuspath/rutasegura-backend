name: Notification CI

on:
  push:
    branches:
      - develop
    paths:
      - 'src/Services/Notification/**'
      - 'src/BuildingBlocks/**'
      - 'Directory.Build.props'
      - '.github/workflows/notification.yml'

jobs:

  build-and-push:
    outputs:
      image_tag: ${{ steps.release.outputs.image_tag }}

    runs-on: ubuntu-latest

    steps:
      - name: Set release tag
        id: release
        run: echo "image_tag=$GITHUB_SHA-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"


      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build Notification
        run: |
          docker build \
            -f src/Services/Notification/Dockerfile \
            -t notification:${{ steps.release.outputs.image_tag }} .

      - name: Tag Notification
        run: |
          docker tag notification:${{ steps.release.outputs.image_tag }} \
          ${{ secrets.ECR_NOTIFICATION_REPOSITORY }}:${{ steps.release.outputs.image_tag }}

      - name: Push Notification
        run: |
          docker push \
          ${{ secrets.ECR_NOTIFICATION_REPOSITORY }}:${{ steps.release.outputs.image_tag }}

  deploy:
    needs: build-and-push
    uses: ./.github/workflows/deploy-ec2.yml
    with:
      service: notification
      image_tag: ${{ needs.build-and-push.outputs.image_tag }}
    secrets: inherit
