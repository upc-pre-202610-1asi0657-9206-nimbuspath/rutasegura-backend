name: Trip Tracking CI

on:
  push:
    branches:
      - develop
    paths:
      - 'src/Services/Trip-Tracking/**'
      - 'src/BuildingBlocks/**'
      - 'Directory.Build.props'
      - '.github/workflows/trip-tracking.yml'

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build Image
        run: |
          docker build \
            -f src/Services/Trip-Tracking/Dockerfile \
            -t trip-tracking:latest .

      - name: Tag Image
        run: |
          docker tag trip-tracking:latest \
          ${{ secrets.ECR_TRIP_TRACKING_REPOSITORY }}:latest

      - name: Push Image
        run: |
          docker push \
          ${{ secrets.ECR_TRIP_TRACKING_REPOSITORY }}:latest

      - name: Deploy EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/rutasegura

            docker compose -f docker-compose.prod.yml pull trip-tracking

            docker compose -f docker-compose.prod.yml up -d trip-tracking