name: rutasegura-notification

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: rutasegura_notification
      MYSQL_USER: notification_app
      MYSQL_PASSWORD: ${NOTIFICATION_MYSQL_PASSWORD:?Define NOTIFICATION_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${NOTIFICATION_MYSQL_ROOT_PASSWORD:?Define NOTIFICATION_MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${NOTIFICATION_MYSQL_PORT:-3308}:3306"
    volumes:
      - notification-mysql-data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # En el despliegue integrado se usa el MISMO broker/exchange que Trip & Tracking, no otro broker aislado.
  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${NOTIFICATION_RABBITMQ_USER:?Define NOTIFICATION_RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${NOTIFICATION_RABBITMQ_PASSWORD:?Define NOTIFICATION_RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:${NOTIFICATION_RABBITMQ_PORT:-5673}:5672"
      - "127.0.0.1:${NOTIFICATION_RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - notification-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  notification-mysql-data:
  notification-rabbitmq-data:
